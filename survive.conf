# Survive configuration (/etc/survive/survive.conf)
# Restart the service after changes: sudo systemctl restart survive
# All durations are in seconds.

# --- Timing --------------------------------------------------------------
# How often the checks run.
CHECK_INTERVAL=30
# When a problem is detected, give the Raspberry Pi this long to recover by
# itself (e.g. Wi-Fi reconnecting) before survive starts repairing.
GRACE_PERIOD=300
# Minimum time between two repair rounds.
ACTION_INTERVAL=60
# Reboot when the Pi has been unreachable this long and repairs did not help.
REBOOT_AFTER=600
ENABLE_REBOOT=true
# Only log what would be done, never change anything (for testing).
DRY_RUN=false

# --- Network -------------------------------------------------------------
# Interfaces to monitor/repair, e.g. "eth0 wlan0". Empty = all physical ones.
INTERFACES=""
# Hosts used to verify connectivity (the default gateway is tried as well).
# For an isolated LAN without internet, list a LAN host here.
PING_TARGETS="1.1.1.1 8.8.8.8 9.9.9.9"
CHECK_GATEWAY=true
# false: reaching the gateway (LAN) is enough to be considered reachable.
# true:  internet access (one of PING_TARGETS) is required.
REQUIRE_INTERNET=false
# Reload the Wi-Fi kernel driver (e.g. brcmfmac) as a last-resort repair.
RELOAD_WIFI_DRIVER=true

# --- SSH -----------------------------------------------------------------
CHECK_SSH=true
SSH_PORT=22

# --- Root filesystem -----------------------------------------------------
# Treat an unexpectedly read-only root filesystem (SD card errors) as a fault.
CHECK_ROOT_RW=true

# --- Reboot protection ---------------------------------------------------
# After this many consecutive reboots without recovery, the reboot delay is
# doubled each time (up to MAX_REBOOT_DELAY) to avoid reboot loops when the
# problem is outside the Pi (e.g. router switched off).
REBOOT_BACKOFF_THRESHOLD=3
MAX_REBOOT_DELAY=3600
# Healthy time after which the consecutive reboot counter is reset.
HEALTHY_RESET_TIME=1800
# Postpone a reboot at most this long while apt/dpkg is running.
PACKAGE_MANAGER_WAIT=1800
# Force the reboot if a graceful reboot has not completed after this long.
REBOOT_FORCE_TIMEOUT=300

# --- Health maintenance --------------------------------------------------
MAINTENANCE_INTERVAL=300
# Clean up journal, apt cache, rotated logs and old temp files above this.
DISK_USAGE_THRESHOLD=90
MEMORY_MIN_AVAILABLE_PCT=5
TEMP_WARN=80
# Extra services that must always be running, e.g. "docker.service nginx.service".
WATCH_SERVICES=""

# --- Crash-loop guard ----------------------------------------------------
# A service stuck restarting in a tight loop (e.g. a wrong bind address) pegs
# the CPU and can make the whole Pi unresponsive. Survive watches systemd's
# per-unit restart counter and contains a runaway unit so the system stays
# reachable; you then fix the unit and start it again.
CRASHLOOP_GUARD=true
# A unit counts as crash-looping when it restarts at least this many times
# within CRASHLOOP_WINDOW seconds.
CRASHLOOP_THRESHOLD=15
CRASHLOOP_WINDOW=120
# What to do with a crash-looping unit:
#   stop = stop it and reset-failed (frees the CPU; the safe default)
#   log  = only record it in the incident log, do not touch the unit
CRASHLOOP_ACTION=stop
# Units to never stop, in addition to the always-protected survive/ssh units.
# e.g. "ollama.service" if you would rather only be told about it.
CRASHLOOP_IGNORE=""

# --- Paths ---------------------------------------------------------------
STATE_DIR=/var/lib/survive
RUN_DIR=/run/survive
EVENT_LOG_MAX_LINES=2000
